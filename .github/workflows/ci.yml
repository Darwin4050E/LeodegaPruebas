name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    name: Backend (PHPUnit, Pint, PHPStan, PHPMD)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, dom, curl, libxml, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Pint (code style)
        run: ./vendor/bin/pint --test

      - name: PHPStan (static analysis, baseline for pre-existing debt)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: PHPMD (mess detector)
        run: ./vendor/bin/phpmd app text phpmd.xml

      - name: PHPUnit
        run: php artisan test

  frontend:
    name: Frontend (typecheck, build, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Lint (non-blocking: ~80 pre-existing issues tracked for Fase 1 del plan de refactorización)
        run: npm run lint
        continue-on-error: true

  e2e:
    name: E2E (Cypress)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, dom, curl, libxml, bcmath
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Prepare backend environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i "s|APP_URL=.*|APP_URL=http://127.0.0.1:8000|" .env
          php artisan migrate --force --seed

      - name: Start backend server
        working-directory: backend
        run: nohup php artisan serve --host=127.0.0.1 --port=8000 > ../backend-serve.log 2>&1 &

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare frontend environment
        working-directory: frontend
        run: echo "VITE_API_URL=http://127.0.0.1:8000/api" > .env

      - name: Start frontend dev server
        working-directory: frontend
        run: nohup npx vite --port 5173 > ../frontend-dev.log 2>&1 &

      - name: Wait for servers
        run: npx wait-on http://127.0.0.1:8000/up http://127.0.0.1:5173

      - name: Run Cypress
        working-directory: frontend
        run: npx cypress run

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend-serve.log
            frontend-dev.log

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore
